name: Static site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm run content:validate

      - name: Audit figure content
        run: pnpm run content:audit:figures

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build static site
        run: pnpm run build

      - name: Verify static artifact
        run: pnpm run static:verify

      - name: Report build size
        run: pnpm run build:size | tee build-size-report.json

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests against static export
        run: pnpm exec playwright test

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build size report
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: build-size-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: bengal-unfolded-static-site
          path: out/
          if-no-files-found: error
          retention-days: 14
