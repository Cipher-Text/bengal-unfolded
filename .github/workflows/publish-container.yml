name: Publish static container

on:
  workflow_run:
    workflows: [Static site CI]
    types: [completed]
    branches: [main]
permissions: {}

concurrency:
  group: publish-container-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated static export
        uses: actions/download-artifact@v4
        with:
          name: bengal-unfolded-static-site
          path: out/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded static artifact
        run: |
          test -s out/bn/index.html
          test -s out/en/index.html
          test -s out/404.html
          test -d out/_next/static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing SHA image
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; skipping duplicate build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish immutable image
        id: image
        if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=Bengal Unfolded static site
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest and size
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
        run: |
          docker pull "$IMAGE"
          echo "Available $IMAGE${DIGEST:+@$DIGEST}"
          docker image inspect "$IMAGE" --format 'Local image size: {{.Size}} bytes'
