server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Legacy routes from docs/STATIC_REDIRECTS.md.
    location ~ ^/(bn|en)/heroes/?$ {
        return 301 /$1/figures/;
    }
    location ~ ^/(bn|en)/heroes/([^/]+)/?$ {
        return 301 /$1/figures/$2/;
    }
    location ~ ^/(bn|en)/events/([^/]+)/heroes/?$ {
        return 301 /$1/events/$2/figures/;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|json|mjs|png|svg|txt|ttf|webmanifest|webp|woff2?|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 80;
    server_name www.bengalunfolded.com;
    return 301 https://bengalunfolded.com$request_uri;
}
